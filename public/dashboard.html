<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FVG 实盘监控</title>
<meta name="theme-color" content="#0b1020" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FVGTrade" />
<link rel="manifest" href="/manifest.json" />
<style>
  html, body { background-color: #0b1020; margin: 0; padding: 0; }
  /* 内联启动屏样式，实现真正的绝对秒开 */
  #splash-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0b1020; z-index: 9999; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
  }
  #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-logo {
    width: 80px; height: 80px; background: linear-gradient(135deg, #5ea6ff, #6b5cff);
    border-radius: 20px; display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: bold; color: #fff; margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(94, 166, 255, 0.4);
  }
  .splash-title { font-size: 24px; font-weight: 600; color: #e6ecff; letter-spacing: 1px; font-family: sans-serif; }
  .splash-spinner {
    margin-top: 30px; width: 24px; height: 24px; border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: #5ea6ff; border-radius: 50%; animation: splash-spin 1s linear infinite;
  }
  @keyframes splash-spin { 100% { transform: rotate(360deg); } }
</style>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<!-- Splash Screen -->
<div id="splash-screen">
  <div class="splash-logo">F</div>
  <div class="splash-title">FVGTrade</div>
  <div class="splash-spinner"></div>
</div>

<header class="appbar">
  <h1>FVG · 实盘监控</h1>
  <nav class="nav">
    <a href="/" class="active">实盘</a>
    <a href="/backtest">回测</a>
  </nav>
</header>

<main class="container">
  <div class="row cols-3">
    <div class="card">
      <h3>系统状态</h3>
      <div id="systemStatus" class="metric muted"><span class="dot off"></span>未运行</div>
      <div id="wsStatus" style="margin-top:6px;"></div>
      <div class="flex" style="margin-top:10px;">
        <button id="btnStart" class="btn success">启动</button>
        <button id="btnStop"  class="btn danger">停止</button>
      </div>
    </div>
    <div class="card">
      <h3>最新价（mark price）</h3>
      <div id="lastPrice" class="metric">-</div>
      <div id="lastTickAt" class="kv"><span class="k">tick 时间</span><span>-</span></div>
    </div>
    <div class="card">
      <h3>决策耗时（最近）</h3>
      <div id="lastDecisionMs" class="metric">- ms</div>
      <div class="kv"><span class="k">tick 数</span><span id="tickCount">0</span></div>
    </div>
  </div>

  <div class="row cols-2" style="margin-top:12px;">
    <div class="card">
      <h3>当前持仓</h3>
      <div id="position">空仓</div>
    </div>
    <div class="card">
      <h3>风控状态</h3>
      <div id="risk"></div>
    </div>
  </div>

  <div class="row cols-2" style="margin-top:12px;">
    <div class="card">
      <h3>1H 看涨 FVG（活跃，按距当前价远近）</h3>
      <div id="fvgRefBull" style="font-size:12px;color:var(--muted);margin-bottom:6px;"></div>
      <div class="scroll-x">
        <table class="table" id="fvgBullTable">
          <thead>
            <tr><th>C1低（关键）</th><th>缺口区间</th><th>距当前价</th><th>形成时间</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h3>1H 看跌 FVG（活跃，按距当前价远近）</h3>
      <div id="fvgRefBear" style="font-size:12px;color:var(--muted);margin-bottom:6px;"></div>
      <div class="scroll-x">
        <table class="table" id="fvgBearTable">
          <thead>
            <tr><th>C1高（关键）</th><th>缺口区间</th><th>距当前价</th><th>形成时间</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:12px; display: none;">
    <h3>WebSocket 事件日志（最近 30 条）</h3>
    <div id="wsEventStats" style="font-size:12px;color:var(--muted);margin-bottom:8px;"></div>
    <div id="wsEvents" style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; max-height: 280px; overflow:auto; background:var(--bg-2); padding:8px; border-radius:8px;"></div>
  </div>

  <div class="card" style="margin-top:12px;">
    <h3>最近交易</h3>
    <div class="scroll-x">
      <table class="table" id="tradesTable">
        <thead>
          <tr><th>时间</th><th>动作</th><th>方向</th><th>信号</th><th>价格</th><th>触发</th><th>备注</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="card" style="margin-top:12px;">
    <h3>配置</h3>
    <div id="config" class="row cols-3"></div>
  </div>
</main>

<script src="/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
    // 防止 SW 静默拒绝向上冒泡（与服务端切换端口/未启动时常见）
    window.addEventListener('unhandledrejection', (e) => {
      if (String(e.reason).includes('Failed to fetch')) e.preventDefault();
    });
  }
</script>
</body>
</html>
