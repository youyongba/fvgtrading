<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FVG 回测</title>
<meta name="theme-color" content="#0b1020" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="/manifest.json" />
<style>
  /* 内联启动屏样式，实现真正的绝对秒开 */
  #splash-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0b1020; z-index: 9999; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
  }
  #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-logo {
    width: 80px; height: 80px; background: linear-gradient(135deg, #5ea6ff, #6b5cff);
    border-radius: 20px; display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: bold; color: #fff; margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(94, 166, 255, 0.4);
  }
  .splash-title { font-size: 24px; font-weight: 600; color: #e6ecff; letter-spacing: 1px; font-family: sans-serif; }
  .splash-spinner {
    margin-top: 30px; width: 24px; height: 24px; border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: #5ea6ff; border-radius: 50%; animation: splash-spin 1s linear infinite;
  }
  @keyframes splash-spin { 100% { transform: rotate(360deg); } }
</style>
<link rel="stylesheet" href="/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<!-- Splash Screen -->
<div id="splash-screen">
  <div class="splash-logo">F</div>
  <div class="splash-title">FVGTrade</div>
  <div class="splash-spinner"></div>
</div>

<header class="appbar">
  <h1>FVG · 回测</h1>
  <nav class="nav">
    <a href="/">实盘</a>
    <a href="/backtest" class="active">回测</a>
  </nav>
</header>

<main class="container">
  <div class="card">
    <h3>新建回测</h3>
    <div class="row cols-3">
      <div>
        <label class="k">起始日期</label>
        <input class="input" type="date" id="startDate" />
      </div>
      <div>
        <label class="k">结束日期</label>
        <input class="input" type="date" id="endDate" />
      </div>
      <div>
        <label class="k">初始资金</label>
        <input class="input" type="number" id="initialCapital" value="10000" />
      </div>
      <div>
        <label class="k">手续费率</label>
        <input class="input" type="number" id="feeRate" value="0.0004" step="0.0001" />
      </div>
    </div>
    <div style="margin-top:10px;">
      <button id="btnStart" class="btn primary">开始回测</button>
      <span id="taskHint" class="badge" style="margin-left:8px;"></span>
    </div>
  </div>

  <div class="card" style="margin-top:12px;">
    <h3>历史任务</h3>
    <div class="scroll-x">
      <table class="table" id="taskTable">
        <thead>
          <tr><th>ID</th><th>日期</th><th>状态</th><th>进度</th><th>盈亏</th><th>胜率</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="card" id="resultCard" style="margin-top:12px; display:none;">
    <h3>结果概览</h3>
    <div id="summary" class="row cols-3"></div>
    <h3 style="margin-top:14px;">净值曲线</h3>
    <canvas id="equityChart" height="200"></canvas>
    <h3 style="margin-top:14px;">月度统计</h3>
    <div class="scroll-x"><table class="table" id="monthlyTable">
      <thead><tr><th>月份</th><th>笔数</th><th>胜率</th><th>盈亏</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <h3 style="margin-top:14px;">交易明细</h3>
    <div class="scroll-x"><table class="table" id="tradeTable">
      <thead><tr><th>开仓</th><th>平仓</th><th>方向</th><th>信号</th><th>入场</th><th>出场</th><th>退出</th><th>盈亏</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
</main>

<script src="/backtest.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
    window.addEventListener('unhandledrejection', (e) => {
      if (String(e.reason).includes('Failed to fetch')) e.preventDefault();
    });
  }
</script>
</body>
</html>
